  <main>
    
<h1>Make an Enquiry</h1>
<p>Use the form below to ask about products, custom cakes or bakery orders.</p>
<form id="enquiryForm">
  <label for="name">Full Name *</label>
  <input id="name" name="name" type="text" required>
  <label for="email">Email Address *</label>
  <input id="email" name="email" type="email" required>
  <label for="phone">Phone Number</label>
  <input id="phone" name="phone" type="tel">
  <label for="type">Enquiry Type *</label>
  <select id="type" name="type" required>
    <option value="">Select an option</option>
    <option>Product enquiry</option>
    <option>Custom cake</option>
    <option>Bulk order</option>
    <option>General enquiry</option>
  </select>
  <label for="message">Message *</label>
  <textarea id="message" name="message" required></textarea>
  <button class="button" type="submit">Submit Enquiry</button>
  <p id="formMessage" class="notice" aria-live="polite"></p>
</form>
<script src="js/script.js"></script>

  </main>
